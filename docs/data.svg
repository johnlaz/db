<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 260" width="910" height="260" role="img" aria-label="Data stays on your device; Groq is used only for optional AI; hosting is your choice"><title>Data stays on your device; Groq is used only for optional AI; hosting is your choice</title><rect width="910" height="260" rx="16" fill="#1A2850"/><text x="40" y="52" fill="#fff" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">Where your data lives</text><rect x="40" y="90" width="250" height="100" rx="12" fill="#243870" stroke="#2F7AD0" stroke-width="1.5"/><text x="165.0" y="134.0" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">On your device</text><text x="165.0" y="158.0" text-anchor="middle" fill="#B9D3F2" font-size="13" font-family="Arial,Helvetica,sans-serif">profile, photos, backups</text><rect x="330" y="90" width="250" height="100" rx="12" fill="#3A2F6B" stroke="#2F7AD0" stroke-width="1.5"/><text x="455.0" y="134.0" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">Groq (optional)</text><text x="455.0" y="158.0" text-anchor="middle" fill="#B9D3F2" font-size="13" font-family="Arial,Helvetica,sans-serif">only when you use AI</text><rect x="620" y="90" width="250" height="100" rx="12" fill="#1F4A3E" stroke="#2F7AD0" stroke-width="1.5"/><text x="745.0" y="134.0" text-anchor="middle" fill="#fff" font-size="18" font-weight="700" font-family="Arial,Helvetica,sans-serif">Your web host</text><text x="745.0" y="158.0" text-anchor="middle" fill="#B9D3F2" font-size="13" font-family="Arial,Helvetica,sans-serif">only if you publish a page</text><text x="40" y="230" fill="#B9D3F2" font-size="14" font-family="Arial,Helvetica,sans-serif">The Groq key stays on this device. Nothing is uploaded unless you choose to.</text></svg>
